name: Primeira Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Testes Unitários & Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          npm install

      - name: Executar testes Python com Cobertura
        run: pytest --cov=src/python --cov-report=xml:coverage-python.xml

      - name: Executar testes JavaScript com Cobertura
        run: npm run test:coverage

      - name: Salvar Relatórios de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-python.xml
            coverage/lcov.info

  sonarcloud:
    name: Análise de Qualidade (SonarCloud)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório (Histórico Completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Relatórios de Cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: Executar Análise SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  gitleaks:
    name: Verificação de Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório (Histórico Completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Verificação de Estilo (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt && npm install
      
      - name: Rodar lint
        run: flake8 src/python tests/python && npm run lint

  deploy:
    name: Deploy
    needs: [tests, sonarcloud, gitleaks, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy
        run: echo "Deploy realizado"
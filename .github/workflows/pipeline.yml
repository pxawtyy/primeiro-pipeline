name: Primeira Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Testes (Python ${{ matrix.python-version }} | Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["20", "22"]
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'
      
      - name: Configurar ambiente Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          npm install

      - name: Executar testes Python com Cobertura
        run: pytest --cov=src/python --cov-report=xml:coverage-python.xml

      - name: Executar testes JavaScript com Cobertura
        run: npm run test:coverage

      - name: Salvar Relatórios de Cobertura
        if: matrix.python-version == '3.12' && matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage-python.xml
            coverage/lcov.info

  sonarcloud:
    name: Análise de Qualidade (SonarCloud)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório (Histórico Completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Relatórios de Cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: Executar Análise SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  gitleaks:
    name: Verificação de Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório (Histórico Completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Verificação de Vulnerabilidades (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=high

  lint:
    name: Verificação de Estilo (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'
      
      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt && npm install
      
      - name: Rodar lint
        run: flake8 src/python tests/python && npm run lint

  deploy:
    name: Deploy
    needs: [tests, sonarcloud, gitleaks, audit, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy
        run: echo "Deploy realizado"
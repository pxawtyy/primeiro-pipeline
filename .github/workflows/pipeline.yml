name: Primeira Pipeline

on:
  push:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        
      - name: Instalar dependências
        run: pip install pytest

      - name: Testar adição
        run: pytest tests/test_adicao.py
  
      - name: Testar subtração
        run: pytest tests/test_subtracao.py
  
      - name: Testar multiplicação
        run: pytest tests/test_multiplicacao.py

      - name: Testar divisão
        run: pytest tests/test_divisao.py
  
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy
        run: echo "Deploy realizado"